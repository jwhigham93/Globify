<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%" style="background:#000">
<head>
  <meta charset="utf-8"/>
  <meta httpEquiv="X-UA-Compatible" content="IE=edge"/>
  <!-- viewport-fit=cover is required or env(safe-area-inset-*) resolves to 0 on iOS. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#000000"/>
  <title>%WEB_TITLE%</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    /* Mirrored into JS by src/components/ui/useSafeAreaInsets.ts. */
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    /* 100vh on iOS means the *large* viewport, so the bottom of the page sits
       under the collapsing Safari/Chrome toolbar and clips the HUD. 100dvh
       tracks the visible viewport; the 100% before it is the fallback for
       browsers without dvh support. */
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      height: 100dvh;
    }

    /* react-native-web ScrollView reset (matches Expo's built-in template) —
       keeps <ScrollView> behaving like it does on native. */
    body { overflow: hidden; overscroll-behavior: none; }

    #root {
      display: flex;
      flex: 1;
      height: 100%;
      height: 100dvh;
    }

    .globify-root {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    /* Scoped to the canvas so panel ScrollViews still scroll, while a one-finger
       globe drag doesn't compete with page scrolling on iOS. */
    canvas { touch-action: none; }

    #loading-shell {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #loading-shell.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: rgba(255, 255, 255, 0.85);
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-label {
      color: rgba(255, 255, 255, 0.35);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="loading-shell">
    <div class="spinner"></div>
    <span class="loading-label">Globify</span>
  </div>
  <div id="root"></div>
  <script>
    // Hide the shell overlay once React has mounted (called from App.tsx).
    window.__hideLoadingShell = function () {
      var el = document.getElementById('loading-shell');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 350);
      }
    };
  </script>
</body>
</html>
